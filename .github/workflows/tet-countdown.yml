name: Tết Countdown

on:
  schedule:
    # Slack posts each message at exactly 09:00 Vietnam time. This run only
    # queues the next 7 days with chat.scheduleMessage, so a GitHub delay of
    # hours (or a skipped day) no longer moves the delivery time. 13:37 UTC is
    # 20:37 in Vietnam. Runs from October 16 so the earliest first countdown day
    # (October 23) is queued in time, through February 19 (latest Tết: Feb 20).
    - cron: '37 13 16-31 10 *'
    - cron: '37 13 * 1,11,12 *'
    - cron: '37 13 1-19 2 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview today's message, queue the next 7 days, or post today's message now
        type: choice
        default: preview
        options:
          - preview
          - queue
          - send

permissions:
  contents: read

concurrency:
  group: tet-countdown-${{ inputs.mode == 'preview' && 'preview' || 'delivery' }}
  cancel-in-progress: false

jobs:
  countdown:
    # Scheduled runs always use the default branch and may lack the repository payload.
    if: >-
      github.repository == 'thaiduc96/tet-countdown-slack' &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preview the countdown
        if: inputs.mode == 'preview'
        run: python3 bot.py --preview

      - name: Queue the next 7 days in Slack
        if: github.event_name == 'schedule' || inputs.mode == 'queue'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python3 bot.py --queue-upcoming

      - name: Post today's message now
        if: inputs.mode == 'send'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python3 bot.py --post-today
